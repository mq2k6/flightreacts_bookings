# Free Supabase projects pause after ~7 days without activity.
# This runs a tiny read-only query every 3 days so the team database stays awake.
# Needs the repository secret SUPABASE_DB_URL = the Supabase "Session pooler" connection
# string (postgresql://postgres.<ref>:<password>@aws-...pooler.supabase.com:5432/postgres).
name: Keep Supabase awake

on:
  schedule:
    - cron: "0 12 */3 * *"   # every 3 days at 12:00 UTC
  workflow_dispatch:          # "Run workflow" button for a manual test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$DB_URL" -c "select count(*) as flights from flight;"
